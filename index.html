.x{border:0;background:var(--row);border-radius:10px;height:40px;cursor:pointer;color:var(--mute)}
.sec h3{font-size:22px;color:var(--acc2);margin:18px 0 6px}

if(du){try{await du.save({filename:name,data:await blob.arrayBuffer()});return}catch(e){}}

<script type="module">
var cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey){try{
const V='https://www.gstatic.com/firebasejs/10.12.2/';
const [A,F,U]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js'),import(V+'firebase-auth.js')]);
const app=A.initializeApp(cfg),db=F.getFirestore(app),au=U.getAuth(app),prov=new U.GoogleAuthProvider();
const C=window.CLOUD={on:true,user:null,surveys:[],resp:{},
login:()=>U.signInWithPopup(au,prov).catch(e=>alert('Login gagal: '+e.message)),
logout:()=>U.signOut(au),
addSurvey:s=>F.setDoc(F.doc(db,'surveys',s.id),{title:s.title,desc:s.desc||'',qs:s.qs,owner:C.user.uid,ownerName:C.user.displayName||'',createdAt:F.serverTimestamp()}),
delSurvey:id=>F.deleteDoc(F.doc(db,'surveys',id)),
addResp:(sid,a)=>F.addDoc(F.collection(db,'responses'),{surveyId:sid,answers:a,ts:F.serverTimestamp()})};
const bad=e=>window.onCloudErr(e.code||e.message);
U.onAuthStateChanged(au,u=>{C.user=u;window.onAuth()});
F.onSnapshot(F.collection(db,'surveys'),s=>{C.surveys=s.docs.map(d=>{const x=d.data();return{id:d.id,title:x.title,desc:x.desc,qs:x.qs,owner:x.owner}});window.onCloud()},bad);
F.onSnapshot(F.collection(db,'responses'),s=>{const r={};s.docs.forEach(d=>{const x=d.data();(r[x.surveyId]=r[x.surveyId]||[]).push(x.answers)});C.resp=r;window.onCloud()},bad);
}catch(e){window.onCloudErr(e.message)}}
</script>
